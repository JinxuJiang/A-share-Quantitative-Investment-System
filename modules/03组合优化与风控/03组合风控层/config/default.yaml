schema_version: portfolio_risk_config_v2

paths:
  portfolio_output_root: ../02组合优化层/outputs
  decision_output_root: ../01组合决策输入层/outputs
  output_root: outputs

risk:
  method: parametric_normal
  horizons:
    weekly: 5
    monthly: 20
  confidence_levels:
    - 0.95
    - 0.99
  expected_return: 0.0
  cash_return: 0.0
  cash_volatility: 0.0
  scaling:
    enabled: true
    confidence_level: 0.95
    var_budgets:
      weekly: 0.075
      monthly: 0.15

validation:
  weight_tolerance: 1.0e-8
  psd_tolerance: 1.0e-10
